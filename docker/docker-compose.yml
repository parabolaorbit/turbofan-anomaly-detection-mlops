services:
  anomaly-api:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: anomaly-api
    ports:
      - "8080:8000"
    volumes:
      - ../logs:/app/logs
      - ../models:/app/models
      - ../config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@anomaly-db:5432/anomaly_db
    depends_on:
      anomaly-db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  anomaly-db:
    image: postgres:16
    container_name: anomaly-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomaly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: