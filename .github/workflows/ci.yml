name: CI

on:
  push:
  pull_request:

jobs:
  test:
    run-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anomaly_db
        ports:
          5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d anomaly_db"
          --health-internal=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/anomaly_db
      MODEL_PATH: models/anomaly_api_model.pt
      SCALER_PATH: models/scaler.pkl
      THRESHOLD: 0.8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: RUn migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest tests/services